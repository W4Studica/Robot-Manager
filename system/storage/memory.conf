# Canonical swap/memory policy for the VMX-pi (sysctl.d).
# zram first: pushing idle anonymous pages into compressed swap is cheaper than
# dropping file cache, and the robot's live pages stay resident in RAM.
vm.swappiness = 180
# zram is random access, so multi-page swap readahead only wastes work.
vm.page-cluster = 0
# Keep directory/inode cache; the root filesystem is on a slow SD card.
vm.vfs_cache_pressure = 50
# Steady background reclaim: no bursty kswapd boosts that would add jitter.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
