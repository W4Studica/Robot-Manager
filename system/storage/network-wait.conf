# Canonical NetworkManager-wait-online policy for a robot without network mounts
# (drop-in: NetworkManager-wait-online.service.d/99-w4studica.conf).
# Wait for NetworkManager startup, but never longer than 15 s, so a Wi-Fi access
# point or client link that cannot connect never stalls the boot.
[Service]
ExecStart=
ExecStart=/usr/bin/nm-online -s -q --timeout=15
TimeoutStartSec=20s
