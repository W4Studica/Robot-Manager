[zram0]
# Canonical zram policy for the VMX-pi: compressed swap on top, disk swap below.
# format: zram-generator.conf.d (systemd-zram-generator)
# Logical swap capacity in MiB (uncompressed); pages are stored compressed.
zram-size = 8192
compression-algorithm = zstd
# Hard cap (MiB) on the host RAM the compressed pages may occupy, so zram alone
# can never exhaust a 2 GiB or 4 GiB board. Overflow goes to the disk swap file.
host-memory-limit = 2048
# Prefer zram over the disk swap file (fstab: sw,pri=10,nofail).
swap-priority = 100
fs-type = swap
